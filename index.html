    <style>
        body {
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none; /* Disable text selection for exam security */
        }

        /* 
           Global Scrollbar Hiding 
           Hides scrollbars on all elements (*) for a seamless app-like feel
           while allowing content to remain scrollable.
        */
        * {
            -ms-overflow-style: none;  /* Internet Explorer and Edge */
            scrollbar-width: none;     /* Firefox */
        }
        
        *::-webkit-scrollbar {
            display: none;             /* Chrome, Safari and Opera */
        }

        /* Specific utility classes for legacy support */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
